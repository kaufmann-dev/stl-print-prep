[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stl-print-prep"
version = "0.1.0"
description = "Reusable STL mesh preparation CLI for print-ready model generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "David Kaufmann" }]
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pymeshlab",
  "scipy",
  "vtk",
]

[project.scripts]
stl-print-prep = "stl_print_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
